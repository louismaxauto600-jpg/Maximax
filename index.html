
<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maximax Multi Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --black:#070502;
  --black2:#150E07;
  --orange:#FF7A1A;
  --orange-light:#FFB066;
  --orange-deep:#8A3400;
  --apricot:#F2A65A;
  --white:#FFC98A;
  --line:rgba(255,176,102,0.28);
  --panel:rgba(7,5,2,0.62);
  --panel-solid:#0D0904;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}

body{
  margin:0;
  color:var(--white);
  font-family:'Public Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 700px at 15% -10%,rgba(255,122,26,.35),transparent 60%),
    radial-gradient(1000px 800px at 100% 30%,rgba(255,122,26,.22),transparent 55%),
    linear-gradient(175deg,#030201 0%,#150E07 16%,#3A1A02 42%,#B34C00 62%,#FF7A1A 78%,#1A0E05 100%);
  background-attachment:fixed;
  background-size:cover;
}

h1,h2,h3{
  font-family:'Fraunces',serif;
  margin:0;
}

.mono{
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.06em;
}

a{color:inherit;}
video,img{max-width:100%;}
button{font-family:inherit;}

/* LOGO */
.logo-mark{
  width:44px;
  height:44px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid var(--orange-light);
  flex-shrink:0;
  background:var(--black2);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.logo-mark video{
  width:100%;
  height:100%;
  object-fit:cover;
  position:absolute;
  inset:0;
}

.logo-mark .fallback{
  font-family:'Fraunces',serif;
  font-weight:700;
  color:var(--orange-light);
  font-size:18px;
  z-index:0;
}

.logo-mark video + .fallback{
  display:none;
}

.seal{
  position:relative;
  width:112px;
  height:112px;
  border-radius:50%;
  border:2px solid var(--orange-light);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  background:var(--black2);
  overflow:hidden;
}

.seal video{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.seal::before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px dashed var(--orange-light);
  border-radius:50%;
  opacity:.6;
  pointer-events:none;
}

.seal.small{
  width:46px;
  height:46px;
  border-width:1.5px;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(7,5,2,.82);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}

.nav-wrap{
  max-width:1180px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 24px;
  gap:16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-name{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:16px;
  letter-spacing:.02em;
}

.brand-name span{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  letter-spacing:.16em;
  color:var(--orange-light);
  font-weight:400;
  margin-top:2px;
}

nav.desktop-nav{
  display:flex;
  gap:18px;
  font-size:13px;
  align-items:center;
}

nav.desktop-nav a{
  text-decoration:none;
  color:var(--white);
  opacity:.8;
  padding:4px 0;
  border-bottom:1px solid transparent;
  transition:.2s;
  white-space:nowrap;
}

nav.desktop-nav a:hover{
  opacity:1;
  border-color:var(--orange-light);
}

.lang-toggle{
  display:flex;
  gap:4px;
  border:1px solid var(--line);
  border-radius:20px;
  padding:3px;
}

.lang-btn{
  background:none;
  border:none;
  color:var(--white);
  opacity:.6;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.06em;
  padding:6px 11px;
  border-radius:16px;
  cursor:pointer;
  transition:.2s;
}

.lang-btn.active{
  background:var(--orange);
  color:#1A0E05;
  opacity:1;
  font-weight:600;
}

.menu-btn{
  display:none;
  background:none;
  border:1px solid var(--line);
  color:var(--white);
  width:38px;
  height:38px;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
}

.mobile-nav{
  display:none;
  flex-direction:column;
  padding:0 24px 18px;
  gap:2px;
}

.mobile-nav a{
  color:var(--white);
  text-decoration:none;
  padding:9px 6px;
  font-size:14px;
  border-bottom:1px solid var(--line);
}

.mobile-nav.open{display:flex;}

@media(max-width:900px){
  nav.desktop-nav{display:none;}
  .menu-btn{display:block;}
}

/* HERO */
.hero{
  max-width:1180px;
  margin:0 auto;
  padding:72px 24px 60px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:40px;
  align-items:center;
}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  letter-spacing:.2em;
  color:var(--orange-light);
  text-transform:uppercase;
  margin-bottom:18px;
  display:inline-block;
}

.hero h1{
  font-size:clamp(2.2rem,5.2vw,3.9rem);
  font-weight:600;
  line-height:1.06;
  letter-spacing:-.01em;
}

.hero h1 em{
  font-style:italic;
  font-weight:500;
  color:var(--orange-light);
}

.hero p.lede{
  margin-top:20px;
  max-width:560px;
  font-size:16px;
  line-height:1.65;
  color:var(--white);
  opacity:.88;
}

.hero .creole{
  margin-top:10px;
  font-style:italic;
  color:var(--orange-light);
  font-size:14px;
  opacity:.9;
}

.passport-row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:20px;
}

.passport-badge{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid var(--line);
  border-radius:6px;
  padding:9px 14px 9px 10px;
  background:rgba(255,122,26,.07);
}

.passport-badge svg{
  width:26px;
  height:26px;
  flex-shrink:0;
}

.passport-badge .pb-text{
  display:flex;
  flex-direction:column;
  line-height:1.25;
}

.passport-badge .pb-code{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.1em;
  color:var(--orange-light);
}

.passport-badge .pb-label{
  font-family:'Public Sans',sans-serif;
  font-size:12.5px;
  font-weight:600;
  color:var(--white);
}

.hero-cta{
  margin-top:28px;
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

.btn{
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:13px 22px;
  border-radius:3px;
  text-decoration:none;
  display:inline-block;
  transition:.2s;
  cursor:pointer;
  border:1px solid transparent;
}

.btn-primary{
  background:var(--orange);
  color:#1A0E05;
  border-color:var(--orange);
}

.btn-primary:hover{background:var(--orange-light);}

.btn-ghost{
  border:1px solid var(--line);
  color:var(--white);
}

.btn-ghost:hover{
  border-color:var(--orange-light);
  color:var(--orange-light);
}

@media(max-width:860px){
  .hero{grid-template-columns:1fr;}
  .hero-seal{display:none;}
}

/* CATEGORY MAP */
.catmap{
  background:rgba(0,0,0,.35);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:30px 24px;
}

.catmap-inner{
  max-width:1180px;
  margin:0 auto;
  display:flex;
  flex-wrap:wrap;
  gap:10px 26px;
  align-items:center;
  justify-content:center;
}

.catmap-item{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  letter-spacing:.05em;
  color:var(--orange-light);
  opacity:.9;
  cursor:pointer;
  text-decoration:none;
}

.catmap-item b{
  color:var(--white);
  opacity:.55;
  margin-right:6px;
}

/* SECTIONS */
main{
  max-width:1180px;
  margin:0 auto;
  padding:64px 24px;
}

.file{
  background:var(--panel);
  color:var(--white);
  border:1px solid var(--line);
  border-radius:6px;
  margin-bottom:26px;
  position:relative;
  backdrop-filter:blur(6px);
  overflow:hidden;
}

.file-tab{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:22px 26px;
  cursor:pointer;
  border-bottom:1px solid var(--line);
}

.file-tab-left{
  display:flex;
  align-items:center;
  gap:16px;
}

.file-num{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--orange-light);
  border:1px solid var(--orange-light);
  border-radius:50%;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.file-tab h2{
  font-size:1.35rem;
  font-weight:600;
}

.file-tab .sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--orange-light);
  margin-top:3px;
  opacity:.7;
}

.chev{
  width:20px;
  height:20px;
  flex-shrink:0;
  transition:transform .3s ease;
  opacity:.7;
  color:var(--orange-light);
}

.file.open .chev{transform:rotate(180deg);}

.file-body{
  max-height:0;
  overflow:hidden;
  transition:max-height .45s ease;
}

.file-body-inner{
  padding:6px 26px 28px;
}

.file.open .file-body{
  max-height:1400px;
}

.service-list{
  columns:2;
  column-gap:30px;
  list-style:none;
  margin:0;
  padding:0;
}

.service-list li{
  break-inside:avoid;
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:8px 0;
  border-bottom:1px dotted var(--line);
  font-size:14px;
  line-height:1.4;
}

.service-list li::before{
  content:"✓";
  color:var(--orange-light);
  font-size:12px;
  margin-top:2px;
  font-weight:700;
  flex-shrink:0;
}

@media(max-width:640px){
  .service-list{columns:1;}
}

/* BANDS */
.band{
  padding:56px 24px;
}

.band-inner{
  max-width:1180px;
  margin:0 auto;
}

.band-news{
  background:rgba(0,0,0,.32);
  border-top:1px solid var(--line);
}

.band-ai{
  background:rgba(0,0,0,.42);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.band-contact{
  background:rgba(0,0,0,.5);
}

.band-head{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:26px;
}

.band-head h2{
  font-size:1.75rem;
  font-weight:600;
}

.band-head .tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--orange-light);
  letter-spacing:.14em;
  text-transform:uppercase;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.chip{
  border:1px solid var(--line);
  border-radius:20px;
  padding:9px 16px;
  font-size:13px;
  color:var(--white);
  opacity:.92;
  background:rgba(0,0,0,.25);
}

.ai-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

.ai-card{
  border:1px solid var(--line);
  border-radius:6px;
  padding:20px;
  background:rgba(255,122,26,.06);
}

.ai-card h3{
  font-size:15px;
  color:var(--orange-light);
  font-weight:600;
  margin-bottom:8px;
  font-family:'Public Sans',sans-serif;
}

.ai-card p{
  font-size:13px;
  opacity:.8;
  margin:0;
  line-height:1.5;
}

/* CONTACT */
.contact-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
  margin-bottom:30px;
}

.contact-card{
  border:1px solid var(--line);
  border-radius:6px;
  padding:20px;
  background:rgba(0,0,0,.3);
}

.contact-card .label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--orange-light);
  margin-bottom:8px;
}

.contact-card .value{
  font-size:15px;
  line-height:1.6;
}

.contact-card a{
  text-decoration:none;
  color:var(--white);
}

.contact-card a:hover{
  color:var(--orange-light);
}

.social-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.social-pill{
  border:1px solid var(--line);
  border-radius:20px;
  padding:9px 18px;
  font-size:13px;
  background:rgba(255,122,26,.08);
  text-decoration:none;
  color:var(--white);
  transition:.2s;
}

.social-pill:hover{
  border-color:var(--orange-light);
  color:var(--orange-light);
}

/* FOOTER */
footer{
  background:rgba(0,0,0,.65);
  padding:50px 24px 28px;
  border-top:1px solid var(--line);
}

.footer-inner{
  max-width:1180px;
  margin:0 auto;
}

.footer-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:30px;
  flex-wrap:wrap;
  padding-bottom:30px;
  border-bottom:1px solid var(--line);
}

.footer-cats{
  display:flex;
  flex-wrap:wrap;
  gap:9px 22px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  opacity:.75;
}

.footer-cats a{text-decoration:none;}

.footer-bottom{
  padding-top:20px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  font-size:11.5px;
  opacity:.6;
  font-family:'IBM Plex Mono',monospace;
}

@media(prefers-reduced-motion:reduce){
  *{
    animation:none!important;
    transition:none!important;
  }
}

:focus-visible{
  outline:2px solid var(--orange-light);
  outline-offset:2px;
}
</style>
</head>
