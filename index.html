<!-- FORM HELP CENTER — NO. 11 -->

<section class="form-help-center" id="form-helper">

<div class="form-center-panel">

<span class="ai-badge">
📋 MAXIMAX FORM HELP CENTER
</span>

<h2>
Find the Right Form and Service
</h2>

<p class="form-center-intro">
Choose the service you need. Form Help Center will show the recommended
form, documents to organize and the correct next step.
</p>

<div class="form-center-controls">

<select id="formCenterSelect" aria-label="Choose a service">

<option value="">
Choose a service
</option>

<option value="notary">
Notary & Translation
</option>

<option value="taxes">
Taxes & Accounting
</option>

<option value="immigration">
Immigration Services
</option>

<option value="eoir">
EOIR & BIA
</option>

<option value="insurance">
Insurance
</option>

<option value="realestate">
Real Estate
</option>

<option value="business">
Business Formation
</option>

<option value="apostille">
Apostille & Legalization
</option>

<option value="travel">
Travel & DMV
</option>

<option value="credit">
Credit Repair
</option>

</select>

<button id="formCenterFind" type="button">
FIND MY FORM
</button>

</div>


<div
class="form-center-result"
id="formCenterResult"
aria-live="polite"
>

<h3 id="formCenterTitle"></h3>

<p id="formCenterDescription"></p>

<h4>
DOCUMENTS TO ORGANIZE
</h4>

<ul id="formCenterDocuments"></ul>

<div class="form-center-actions">

<a
class="form-center-link primary"
id="formCenterModuleLink"
href="#services"
>
OPEN MAXIMAX FORM
</a>

<a
class="form-center-link"
id="formCenterOfficialLink"
href="#"
target="_blank"
rel="noopener noreferrer"
>
OPEN OFFICIAL WEBSITE
</a>

</div>

</div>

</div>

</section>


<style>

.form-help-center{
max-width:1180px;
margin:0 auto;
padding:60px 24px;
scroll-margin-top:110px
}

.form-center-panel{
padding:24px;
border:1px solid var(--line);
border-radius:12px;
background:rgba(0,0,0,.82)
}

.form-center-panel h2{
font-size:clamp(1.8rem,4vw,2.8rem);
color:var(--orange-light);
margin:14px 0
}

.form-center-intro{
max-width:760px;
line-height:1.7
}

.form-center-controls{
display:grid;
grid-template-columns:1fr auto;
gap:12px;
margin-top:22px
}

.form-center-controls select{
width:100%;
min-height:48px;
padding:11px 12px;
border:1px solid var(--line);
border-radius:6px;
background:#050505;
color:var(--text);
color-scheme:dark;
outline:none
}

.form-center-controls select:focus{
border-color:var(--orange-light);
box-shadow:0 0 0 2px rgba(255,106,0,.22)
}

.form-center-controls button{
min-height:48px;
padding:11px 22px;
border:1px solid var(--orange-light);
border-radius:6px;
background:var(--orange);
color:#000;
font-family:'IBM Plex Mono',monospace;
font-size:10px;
font-weight:800;
cursor:pointer
}

.form-center-result{
display:none;
margin-top:22px;
padding:20px;
border:1px solid var(--line);
border-radius:10px;
background:#050505
}

.form-center-result.active{
display:block
}

.form-center-result h3{
margin-bottom:12px;
font-size:1.7rem;
color:var(--orange-light)
}

.form-center-result h4{
margin:20px 0 8px;
font-family:'IBM Plex Mono',monospace;
font-size:10px;
letter-spacing:.1em;
color:var(--orange-light)
}

.form-center-result ul{
margin:12px 0 18px;
padding-left:20px;
line-height:1.8
}

.form-center-actions{
display:flex;
flex-wrap:wrap;
gap:10px
}

.form-center-link{
display:inline-block;
padding:11px 15px;
border:1px solid var(--line);
border-radius:6px;
background:#000;
color:var(--orange-light);
font-family:'IBM Plex Mono',monospace;
font-size:10px;
font-weight:600
}

.form-center-link.primary{
background:var(--orange);
color:#000;
border-color:var(--orange-light)
}

@media(max-width:600px){

.form-center-controls{
grid-template-columns:1fr
}

.form-center-controls button{
width:100%
}

.form-center-actions{
flex-direction:column
}

.form-center-link{
width:100%;
text-align:center
}

}

</style>


<script>

const formCenterData={

notary:{
title:"Notary & Translation",
description:"Use Maximax Module 01 for notary, affidavits, powers of attorney, certified translation or minor travel consent.",
documents:[
"Valid photo identification",
"Unsigned document when notarization is required",
"Clear document copy for translation"
],
module:"#mod1",
official:"https://dos.fl.gov/sunbiz/other-services/notaries/"
},

taxes:{
title:"Taxes & Accounting",
description:"Use Maximax Module 02 for personal taxes, business taxes, ITIN, bookkeeping, payroll or IRS notices.",
documents:[
"Photo identification",
"Tax documents for the applicable year",
"Income and expense records"
],
module:"#mod2",
official:"https://www.irs.gov/forms-instructions"
},

immigration:{
title:"Immigration Services",
description:"Use Maximax Module 03 for TPS, asylum, work permit, family petition, green card or citizenship assistance.",
documents:[
"USCIS notices or receipt copies",
"Identity and civil-document copies",
"Applicable immigration-history documents"
],
module:"#mod3",
official:"https://www.uscis.gov/forms/all-forms"
},

eoir:{
title:"EOIR & BIA",
description:"Use Maximax Module 04 for immigration-court information, hearing checks, BIA information or document organization.",
documents:[
"Immigration court notice copies",
"Hearing or deadline information",
"Supporting case-document copies"
],
module:"#mod4",
official:"https://www.justice.gov/eoir/eoir-forms"
},

insurance:{
title:"Insurance",
description:"Use Maximax Module 05 for auto, home, renters, life, health or business insurance information.",
documents:[
"Current insurance policy when available",
"Basic property or vehicle information",
"Preferred coverage and start date"
],
module:"#mod5",
official:"https://www.healthcare.gov/"
},

realestate:{
title:"Real Estate",
description:"Use Maximax Module 06 for buying, selling, renting, housing resources or mortgage referrals.",
documents:[
"Photo identification",
"Preferred location and budget",
"Income or housing documents when requested"
],
module:"#mod6",
official:"https://www.hud.gov/helping-americans"
},

business:{
title:"Business Formation",
description:"Use Maximax Module 07 for LLC, corporation, EIN, registration or business-plan assistance.",
documents:[
"Proposed business name",
"Owner contact information",
"Business address and activity description"
],
module:"#mod7",
official:"https://www.sba.gov/business-guide/launch-your-business/register-your-business"
},

apostille:{
title:"Apostille & Legalization",
description:"Use Maximax Module 08 for state apostille, federal authentication or embassy legalization.",
documents:[
"Clear document copy",
"Issuing state or federal agency",
"Destination country and deadline"
],
module:"#mod8",
official:"https://travel.state.gov/en/replace-certify/authenticate-documents.html"
},

travel:{
title:"Travel & DMV",
description:"Use Maximax Module 09 for passport, travel, driver-license, registration, tag or title assistance.",
documents:[
"Photo identification",
"Applicable travel or vehicle documents",
"Appointment or travel date"
],
module:"#mod9",
official:"https://www.usa.gov/travel-documents"
},

credit:{
title:"Credit Repair",
description:"Use Maximax Module 16 for credit-report review, possible error disputes, identity-theft recovery or credit education.",
documents:[
"Current credit-report copy",
"Copies of supporting records",
"List of items you believe may be inaccurate"
],
module:"#mod16",
official:"https://www.annualcreditreport.com/"
}

};


const formCenterSelect=
document.getElementById("formCenterSelect");

const formCenterFind=
document.getElementById("formCenterFind");

const formCenterResult=
document.getElementById("formCenterResult");

const formCenterTitle=
document.getElementById("formCenterTitle");

const formCenterDescription=
document.getElementById("formCenterDescription");

const formCenterDocuments=
document.getElementById("formCenterDocuments");

const formCenterModuleLink=
document.getElementById("formCenterModuleLink");

const formCenterOfficialLink=
document.getElementById("formCenterOfficialLink");


function openFormHelpCenter(){

document
.querySelectorAll(".file")
.forEach(function(file){

file.classList.remove(
"active",
"open"
);

});

const formCenter=
document.getElementById("form-helper");

if(formCenter){

const top=
formCenter
.getBoundingClientRect()
.top+
window.pageYOffset-
105;

window.scrollTo({
top:top,
behavior:"smooth"
});

}

}


document
.querySelectorAll(
'.service-seal[href="#form-helper"],.catmap-item[href="#form-helper"]'
)
.forEach(function(button){

button.addEventListener(
"click",
function(event){

event.preventDefault();

openFormHelpCenter();

}
);

});


const formHelperCard=
document.getElementById("form-helper-card");

if(formHelperCard){

formHelperCard.addEventListener(
"click",
openFormHelpCenter
);

formHelperCard.addEventListener(
"keydown",
function(event){

if(
event.key==="Enter"||
event.key===" "
){

event.preventDefault();

openFormHelpCenter();

}

}
);

}


if(
formCenterFind&&
formCenterSelect
){

formCenterFind.addEventListener(
"click",
function(){

const item=
formCenterData[
formCenterSelect.value
];

if(!item){

formCenterResult
.classList
.remove("active");

return;

}

formCenterTitle.textContent=
item.title;

formCenterDescription.textContent=
item.description;

formCenterDocuments.innerHTML=
item.documents
.map(function(documentName){

return "<li>"+
documentName+
"</li>";

})
.join("");

formCenterModuleLink.href=
item.module;

formCenterOfficialLink.href=
item.official;

formCenterResult
.classList
.add("active");

}
);


formCenterModuleLink.addEventListener(
"click",
function(event){

event.preventDefault();

const id=
this
.getAttribute("href")
.slice(1);

const file=
document.getElementById(id);

if(file){

document
.querySelectorAll(".file")
.forEach(function(module){

const selected=
module.id===id;

module
.classList
.toggle(
"active",
selected
);

module
.classList
.toggle(
"open",
selected
);

});

const top=
file
.getBoundingClientRect()
.top+
window.pageYOffset-
100;

window.scrollTo({
top:top,
behavior:"smooth"
});

}

}
);

}

</script>
